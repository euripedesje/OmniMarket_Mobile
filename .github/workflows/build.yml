name: Criar Aplicativo Android

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preparar o Java (Obrigatório para Android)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Instalar ferramentas de extração do Linux
        run: sudo apt-get update && sudo apt-get install -y xz-utils tar curl zip unzip

      - name: Instalar Flet e Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Construir o APK
        run: flet build apk

      - name: Guardar o Aplicativo Pronto
        uses: actions/upload-artifact@v4
        with:
          name: OmniMarketPOS-APK
          path: build/apk/**/*.apk
